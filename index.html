<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이모지 RPG · P2P 멀티플레이</title>
<style>
 :root { color-scheme:light dark; --bg:#f5f7fb; --card:#ffffff; --fg:#1b2033; --sub:#65708f; --line:#d8deeb; --acc:#2f68d8; --btnfg:#ffffff; --tile1:#edf1f7; --tile2:#e5eaf3; --ok:#1f9d5b; --bad:#d63a4c; --shadow:rgba(38,46,74,.12); }
@media (prefers-color-scheme:dark) { :root { --bg:#12162b; --card:#1c2240; --fg:#eef0ff; --sub:#9aa3d0; --line:#313a6b; --acc:#6ea1ff; --btnfg:#07111f; --tile1:#232a4d; --tile2:#1f2645; --ok:#5fe39b; --bad:#ff6b7a; --shadow:rgba(0,0,0,.24); } }
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; overflow:hidden; transition:background .2s ease,color .2s ease; }
button,input { font:inherit; color:inherit; }
button { background:var(--acc); color:var(--btnfg); border:0; border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer; min-height:40px; }
button:focus-visible,input:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
input { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; min-width:0; flex:1; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 8px 24px var(--shadow); }
#lobby { width:min(520px,calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow:auto; margin:12px auto; }
#lobby h1 { margin:0 0 6px; font-size:26px; }
#lobby h1 small { font-size:13px; color:var(--acc); margin-left:6px; }
#lobby h3 { margin:18px 0 8px; font-size:15px; }
.row { display:flex; gap:8px; margin-top:10px; }
.empty { color:var(--sub); font-size:13px; }
#msg { margin-top:10px; color:var(--bad); min-height:18px; font-size:13px; }
.room { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:7px; }
.room span { color:var(--sub); font-size:13px; }
#game { position:fixed; inset:0; width:100vw; height:100dvh; overflow:hidden; background:var(--bg); }
#stage { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; border-radius:0; background:var(--bg); box-shadow:none; }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:0; touch-action:none; background:var(--tile1); }
#top { position:absolute; z-index:4; top:max(10px,env(safe-area-inset-top)); left:max(10px,env(safe-area-inset-left)); right:max(10px,env(safe-area-inset-right)); min-height:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 11px; border-radius:12px; background:color-mix(in srgb,var(--card) 82%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 6px 18px rgba(0,0,0,.18); }
#zoneHud { position:absolute; z-index:4; top:64px; left:max(10px,env(safe-area-inset-left)); display:flex; flex-direction:column; gap:2px; max-width:min(360px,70vw); padding:8px 11px; border-radius:11px; background:color-mix(in srgb,var(--card) 86%,transparent); border:1px solid color-mix(in srgb,var(--line) 70%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 6px 18px rgba(0,0,0,.14); pointer-events:none; }
#zoneName { font-weight:800; font-size:14px; }
#zoneMeta { color:var(--sub); font-size:11px; }
#minimapWrap { position:absolute; z-index:5; top:64px; right:12px; width:196px; padding:6px; border-radius:12px; background:color-mix(in srgb,var(--card) 88%,transparent); border:1px solid color-mix(in srgb,var(--line) 75%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 22px rgba(0,0,0,.16); }
#minimap { width:100%; height:auto; display:block; image-rendering:pixelated; border-radius:8px; background:var(--bg); }
#minimapLegend { display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:5px; color:var(--sub); font-size:10px; }
@media(max-width:720px){ #minimapWrap { width:154px; right:8px; top:100px; } #zoneHud { top:58px; left:8px; } }
#roomTitle { color:var(--sub); }
#badge { font-weight:700; color:var(--acc); white-space:nowrap; }
#badge .net { color:var(--sub); font-weight:600; margin-left:8px; }
#pad { position:absolute; z-index:5; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(360px,calc(100vw - 20px)); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:7px; border-radius:14px; background:color-mix(in srgb,var(--card) 76%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 24px rgba(0,0,0,.18); }
#pad button { font-size:20px; padding:10px 0; min-height:44px; }
#btnAtk { grid-column:1 / -1; }
#side { display:none; }
button:disabled { opacity:.55; cursor:not-allowed; }
@media (max-width:520px) {
  #lobby { width:calc(100vw - 16px); max-height:calc(100dvh - 16px); margin:8px auto; }
  #pad { width:min(330px,calc(100vw - 12px)); }
  #top { font-size:13px; }
}
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }

#menu { position:absolute; z-index:6; top:64px; right:12px; display:flex; gap:6px; }
#menu button { min-height:36px; padding:7px 10px; font-size:13px; background:color-mix(in srgb,var(--card) 88%,transparent); color:var(--fg); border:1px solid var(--line); backdrop-filter:blur(10px); }
#overlayPanel { position:absolute; z-index:8; top:110px; right:12px; width:min(360px,calc(100vw - 24px)); max-height:calc(100dvh - 130px); overflow:auto; display:none; background:color-mix(in srgb,var(--card) 96%,transparent); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
#overlayPanel.open { display:block; }
#networkError { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.58); backdrop-filter:blur(5px); }
#networkError[hidden] { display:none; }
.netErrorCard { width:min(420px,100%); background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 18px 60px rgba(0,0,0,.35); }
.netErrorCard h3 { margin:0 0 8px; }
.netErrorCard p { margin:0; color:var(--sub); font-size:13px; line-height:1.5; white-space:pre-line; }
.netErrorActions { display:flex; gap:8px; margin-top:14px; }
.netErrorActions button { flex:1; }
.panelHead { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; background:color-mix(in srgb,var(--card) 97%,transparent); border-bottom:1px solid var(--line); }
.panelBody { padding:12px 14px; }
.panelGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.itemBtn { min-height:68px; padding:6px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; }
.itemBtn strong { font-size:23px; line-height:1; }
.itemBtn small { color:var(--sub); }
.section { margin-bottom:14px; }
.section:last-child { margin-bottom:0; }
.sectionTitle { font-size:13px; font-weight:800; margin-bottom:7px; color:var(--sub); }
.statGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.statBox { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 8px; font-size:12px; }
.tradeTarget { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px; }
.tradeOffer { border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg); }
.tradeLine { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:12px; margin:4px 0; }
.tradeActions { display:flex; gap:6px; margin-top:8px; }
.tradeActions button { flex:1; min-height:36px; padding:7px 8px; }
.chatLog { max-height:190px; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px; font-size:12px; }
.chatMsg { margin:3px 0; line-height:1.35; word-break:break-word; }
.chatMsg b { color:var(--acc); }
.chatNotice { margin-top:7px; padding:7px 9px; border-radius:8px; background:color-mix(in srgb,var(--tile2) 85%,transparent); color:var(--muted); font-size:11px; line-height:1.4; }
.chatInput { display:flex; gap:6px; margin-top:7px; }
.chatInput input { min-width:0; }
.quest { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:9px; font-size:12px; }
.socialList{display:flex;flex-direction:column;gap:6px}.socialRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.socialMain{min-width:0}.socialMain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.socialSub{color:var(--muted);font-size:10px}.socialActions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.socialActions button{min-height:30px;padding:5px 7px;font-size:11px}.partyBar{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin-bottom:8px}.partyMember{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:12px}.partyMember:first-child{border-top:0}.shopGrid{display:grid;gap:6px}.shopRow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.shopIcon{font-size:23px;text-align:center}.shopInfo{min-width:0}.shopInfo b{display:block}.shopInfo small{color:var(--muted)}.npcHint{padding:8px 9px;border-radius:8px;background:color-mix(in srgb,var(--tile2) 85%,transparent);color:var(--muted);font-size:11px;line-height:1.4;margin-bottom:8px}.friendCodeBox{display:flex;gap:6px;margin-bottom:8px}.friendCodeBox input{min-width:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.recoveryLobby{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.recoveryCode{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;line-height:1.45;word-break:break-all;padding:8px;border:1px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--card) 70%,transparent);margin-bottom:7px}.recoveryWarn{padding:8px 9px;border-radius:8px;background:color-mix(in srgb,#f0b 8%,var(--bg));color:var(--sub);font-size:11px;line-height:1.45;margin-top:7px}.recoveryActions{display:flex;gap:6px;flex-wrap:wrap}.recoveryActions button{flex:1;min-width:120px}
.quest progress { width:100%; height:7px; margin-top:7px; }
@media(max-width:720px){ #menu { top:58px; right:8px; } #overlayPanel { top:100px; right:8px; width:min(390px,calc(100vw - 16px)); max-height:calc(100dvh - 112px); } }
</style>
</head>
<body>

<div id="lobby" class="card">
  <h1>🗡️ 이모지 RPG<small>P2P 멀티플레이</small></h1>
  <div class="empty">방을 만들거나 공개 방 목록에서 바로 입장하세요.</div>
  <div class="row">
    <input id="roomName" maxlength="16" placeholder="방 이름" aria-label="방 이름">
    <button id="btnCreate">방 만들기</button>
    <button id="btnQuick" type="button">⚡ 빠른 참가</button>
  </div>
  <h3>🌐 공개 방 목록</h3>
  <div id="rooms"><div class="empty">열려 있는 방을 찾는 중…</div></div>
  <h3>🗝️ 계정 복구</h3>
  <div class="recoveryLobby">
    <div class="recoveryCode" id="lobbyRecoveryCode">연결하면 복구 코드가 발급돼.</div>
    <div class="row"><button id="btnCopyRecovery" type="button">📋 코드 복사</button><button id="btnNewRecovery" type="button">🔄 새 코드</button></div>
    <div class="row"><input id="recoveryInput" maxlength="5000" placeholder="복구 코드 붙여넣기"><button id="btnRecover" type="button">복구</button></div>
    <div class="empty">복구 코드는 현재 계정 데이터가 들어 있는 백업 코드야. 최신 데이터로 다시 발급해서 보관해 두는 걸 권장해.</div>
  </div>
  <div id="msg" role="alert"></div>
</div>

<div id="game" hidden>
  <div id="stage">
    <canvas id="cv" width="800" height="560"></canvas>
    <div id="top">
      <div>방 <b id="roomCode">-----</b> · <span id="roomTitle"></span></div>
      <div style="display:flex;align-items:center;gap:8px"><span id="miniHud">❤️ -- · 💰 --</span><div id="badge"></div></div>
    </div>
    <div id="zoneHud"><div id="zoneName">🗺️ 루미나 마을</div><div id="zoneMeta">안전구역 · 전투 불가</div></div>
    <div id="minimapWrap"><canvas id="minimap" width="192" height="128"></canvas><div id="minimapLegend"><span>🟩 마을</span><span>🟦 물</span><span>🟥 던전</span><span>🟡 나</span></div></div>
    <div id="menu">
      <button id="btnInv">🎒 가방</button>
      <button id="btnTrade">🤝 거래</button>
      <button id="btnChat">💬 채팅</button>
      <button id="btnQuest">📜 퀘스트</button>
      <button id="btnSocial">👥 친구/파티</button>
      <button id="btnShop">🏪 상점</button>
      <button id="btnRecovery">🗝️ 복구</button>
    </div>
    <div id="overlayPanel" aria-live="polite">
      <div class="panelHead"><b id="panelTitle">온라인 RPG</b><button id="btnClosePanel">닫기</button></div>
      <div class="panelBody" id="panelBody"></div>
    </div>
    <div id="pad">
      <button data-dx="-1" data-dy="0" aria-label="왼쪽">⬅️</button>
      <button data-dx="0" data-dy="-1" aria-label="위">⬆️</button>
      <button data-dx="0" data-dy="1" aria-label="아래">⬇️</button>
      <button data-dx="1" data-dy="0" aria-label="오른쪽">➡️</button>
      <button id="btnAtk">⚔️ 공격 (스페이스)</button>
    </div>
  </div>
  <div id="side">
    <div id="hud" class="card"></div>
    <div class="card"><b>👥 파티</b><div id="plist"></div></div>
    <div id="log" class="card"></div>
  </div>
</div>

<div id="networkError" hidden aria-modal="true" role="dialog">
  <div class="netErrorCard">
    <h3 id="networkErrorTitle">⚠️ 연결 오류</h3>
    <p id="networkErrorText">연결을 설정하지 못했습니다.</p>
    <div class="netErrorActions">
      <button id="networkErrorRetry">다시 연결</button>
      <button id="networkErrorLobby">로비로</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
'use strict';

/* ============================================================
   상수 / 유틸
   ============================================================ */
const W = 96, H = 64, T = 40;
const TOPIC = 'emoji-rpg-kro/rooms/';
const MAP_REGIONS = {
  town:    { key:'town',    x:34, y:21, w:28, h:22, name:'루미나 마을', meta:'안전구역 · 전투 불가', safe:true },
  safe:    { key:'safe',    x:39, y:25, w:18, h:14, name:'루미나 마을 중앙광장', meta:'안전구역 · 회복과 거래', safe:true },
  dungeon: { key:'dungeon', x:70, y:17, w:22, h:32, name:'잊힌 광산 던전', meta:'던전 · 몬스터 출현', danger:true },
  field:   { key:'field',   x:0,  y:0,  w:96, h:64, name:'바람초원', meta:'일반 필드 · 몬스터 출현' }
};
const DUNGEON_ENTRANCE = { x:69, y:32, name:'잊힌 광산 입구' };
const MAP_PATHS = [
  {x:0,y:31,w:34,h:3}, {x:34,y:30,w:36,h:5}, {x:62,y:31,w:8,h:3}, {x:56,y:0,w:4,h:21}, {x:48,y:39,w:4,h:25}
];
const LAKE = {x:8,y:7,w:18,h:13};
const RIVER = {x:64,y:0,w:3,h:64};
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const EMOJIS = ['⚔️', '🧙‍♂️', '🏹', '🥷', '🛡️', '🧝', '🧛', '🐱'];
const MONS = {
  '🦠': { hp: 20,  dmg: 3,  gold: 5,  xp: 8,  spd: 1400 },
  '👺': { hp: 45,  dmg: 6,  gold: 12, xp: 20, spd: 1100 },
  '🐉': { hp: 120, dmg: 12, gold: 40, xp: 60, spd: 900 }
};
const ITEMS = {
  potion: { id:'potion', name:'회복 물약', icon:'🧪', type:'consumable', max:20, heal:30, price:15 },
  slimeGel: { id:'slimeGel', name:'슬라임 젤리', icon:'🟢', type:'material', max:99, price:4 },
  fang: { id:'fang', name:'도깨비 송곳니', icon:'🦷', type:'material', max:99, price:9 },
  scale: { id:'scale', name:'용의 비늘', icon:'🔴', type:'material', max:99, price:35 },
  ironSword: { id:'ironSword', name:'철검', icon:'⚔️', type:'weapon', max:1, atk:5, price:60 },
  leather: { id:'leather', name:'가죽 갑옷', icon:'🛡️', type:'armor', max:1, def:3, price:60 }
};
const MON_DROPS = {
  '🦠': { item:'slimeGel', min:1, max:2, chance:0.85 },
  '👺': { item:'fang', min:1, max:2, chance:0.75 },
  '🐉': { item:'scale', min:1, max:2, chance:0.90 }
};
const QUESTS = {
  slime_hunt: { id:'slime_hunt', name:'슬라임 토벌', text:'슬라임 5마리 처치', need:5, item:'potion', count:2, gold:30 }
};
const NPCS = { merchant: { id:'merchant', x:49, y:29, name:'상인 루루', icon:'🧑‍🍳' } };
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const maxHp = p => 50 + p.lv * 10;
const hostId = (code, gen) => 'erpg-' + code + '-h' + gen;
function insideRect(x,y,r){ return x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h; }
function regionAt(x,y){
  if(insideRect(x,y,MAP_REGIONS.safe)) return MAP_REGIONS.safe;
  if(insideRect(x,y,MAP_REGIONS.town)) return MAP_REGIONS.town;
  if(insideRect(x,y,MAP_REGIONS.dungeon)) return MAP_REGIONS.dungeon;
  return MAP_REGIONS.field;
}
function isRoad(x,y){ return MAP_PATHS.some(r=>insideRect(x,y,r)); }
function isForest(x,y){ return x>=4&&x<30&&y>=40&&y<60; }
function isLake(x,y){ return insideRect(x,y,LAKE); }
function isWater(x,y){
  if(isLake(x,y)) return true;
  if(insideRect(x,y,RIVER)) return !(y>=29&&y<=35);
  return false;
}
function isDungeonWall(x,y){
  const r=MAP_REGIONS.dungeon;
  if(!insideRect(x,y,r)) return false;
  const left=x===r.x, right=x===r.x+r.w-1, top=y===r.y, bottom=y===r.y+r.h-1;
  if(!(left||right||top||bottom)) return false;
  return !(left && y>=29 && y<=35);
}
function isTownWall(x,y){
  const r=MAP_REGIONS.town;
  if(!insideRect(x,y,r)) return false;
  const wall = x===r.x || x===r.x+r.w-1 || y===r.y || y===r.y+r.h-1;
  if(!wall) return false;
  // 서쪽·동쪽 통로와 남쪽 광장 출입구를 열어둔다.
  if((x===r.x || x===r.x+r.w-1) && y>=30 && y<=34) return false;
  if(y===r.y && x>=46 && x<=50) return false;
  if(y===r.y+r.h-1 && x>=46 && x<=50) return false;
  return true;
}
function hash2(x,y){ let n=(x*374761393+y*668265263)|0; n=(n^(n>>>13))*1274126177; return (n^(n>>>16))>>>0; }
function isBlocked(x,y){
  if(x<0||y<0||x>=W||y>=H) return true;
  if(isWater(x,y)) return true;
  if(isTownWall(x,y)||isDungeonWall(x,y)) return true;
  if(isForest(x,y) && (hash2(x,y)%100)<31 && !isRoad(x,y)) return true;
  // 바람초원 곳곳의 바위·나무는 결정적으로 생성된다.
  if(!isRoad(x,y) && !insideRect(x,y,MAP_REGIONS.town) && !insideRect(x,y,MAP_REGIONS.dungeon) && (hash2(x+17,y+41)%100)<4) return true;
  // 던전 내부는 통로와 방 형태로 일부 장애물을 만든다.
  if(insideRect(x,y,MAP_REGIONS.dungeon) && !isDungeonWall(x,y)){
    const rx=x-MAP_REGIONS.dungeon.x, ry=y-MAP_REGIONS.dungeon.y;
    if((rx===6||rx===14) && ry>3 && ry<28) return true;
    if((ry===9||ry===21) && rx>2 && rx<19) return true;
    if((rx===6||rx===14) && (ry===9||ry===21)) return false;
  }
  return false;
}
function isSafeZone(x,y){ return !!regionAt(x,y).safe; }

/* 기기 성능/네트워크 측정
   - CPU: 짧은 실제 연산 벤치마크 + 논리 코어 수
   - RAM: navigator.deviceMemory(브라우저가 제공하는 대략적인 RAM 등급)
   - Ping: 실제 PeerJS 데이터 채널 RTT를 호스트가 측정
*/
function runCpuBenchmark() {
  try {
    const samples = [];
    let sink = 0;
    for (let round = 0; round < 3; round++) {
      const start = performance.now();
      const end = start + 18;
      let ops = 0;
      while (performance.now() < end) {
        for (let i = 0; i < 1200; i++) {
          sink = Math.imul(sink ^ i, 1664525) + 1013904223;
        }
        ops += 1200;
      }
      const elapsed = Math.max(1, performance.now() - start);
      samples.push(ops / elapsed);
    }
    samples.sort((a, b) => a - b);
    window.__emojiRpgCpuSink = sink;
    return samples[1] || samples[0] || 1;
  } catch (e) {
    return 1;
  }
}

function detectCapabilities() {
  const navConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const cores = Math.max(1, Number(navigator.hardwareConcurrency) || 2);
  const ram = Math.max(0.25, Number(navigator.deviceMemory) || 4);
  const cpuPerf = Math.max(1, runCpuBenchmark());
  const browserRtt = Math.max(1, Number(navConn && navConn.rtt) || 80);
  return {
    cores,
    ram,
    cpuPerf: +cpuPerf.toFixed(2),
    browserRtt,
    measuredRtt: null,
    updatedAt: Date.now()
  };
}

function capabilityScore(c) {
  if (!c) return 0;
  const cpuPart = Math.log2(Math.max(1, c.cpuPerf)) * 22;
  const corePart = Math.log2(Math.max(1, c.cores)) * 14;
  const ramPart = Math.log2(Math.max(0.25, c.ram) + 1) * 18;
  return +(cpuPart + corePart + ramPart).toFixed(2);
}

let AC = null;
function playSound(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const note = (f, st, d, wave, vol, f2) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = wave;
      o.frequency.setValueAtTime(f, t0 + st);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + st + d);
      g.gain.setValueAtTime(vol, t0 + st);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + d);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + st); o.stop(t0 + st + d + 0.02);
    };
    if (type === 'move') {
      note(240, 0, 0.06, 'triangle', 0.16, 110);
    } else if (type === 'attack') {
      note(1400, 0, 0.14, 'square', 0.07, 500);
      note(2100, 0.015, 0.2, 'sawtooth', 0.045, 900);
      note(180, 0, 0.1, 'triangle', 0.14, 70);
    } else if (type === 'sys') {
      [880, 1175, 1568, 1175, 1568, 1976].forEach((f, i) => note(f, i * 0.11, 0.18, 'sine', 0.2));
    } else if (type === 'lvl') {
      [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.09, 0.2, 'triangle', 0.18));
    }
  } catch (e) { /* 오디오 미지원 환경 무시 */ }
}

function initDirectory() {
  try {
    S.mq = mqtt.connect(BROKER, {
      clientId: 'erpg_' + S.uid + rnd(9999),
      reconnectPeriod: 4000,
      connectTimeout: 8000,
      keepalive: 30
    });
    S.mq.on('connect', () => {
      setNetState(S.started ? 'connected' : 'ready');
      S.mq.subscribe(TOPIC + '+', err => {
        if (err) lobbyMsg('공개 방 목록 구독에 실패했습니다.');
      });
    });
    S.mq.on('reconnect', () => {
      if (!S.started) lobbyMsg('공개 방 목록에 다시 연결하는 중…');
    });
    S.mq.on('error', e => {
      if (!S.started) lobbyMsg('공개 방 목록 연결 오류: ' + (e && e.message ? e.message : '알 수 없는 오류'));
    });
    S.mq.on('message', (topic, buf) => {
      const code = topic.slice(TOPIC.length), s = buf.toString();
      if (!s) delete S.rooms[code];
      else {
        try {
          const r = JSON.parse(s);
          if (r && typeof r === 'object' && r.code === code && Date.now() - (+r.ts || 0) < 30000) {
            S.rooms[code] = {
              code,
              name: String(r.name || '이름 없는 방').slice(0, 16),
              gen: Math.max(0, +r.gen || 0),
              host: String(r.host || '').slice(0, 10),
              count: clamp(+r.count || 0, 0, 12),
              ts: +r.ts || 0
            };
          }
        } catch (e) { /* 잘못된 공개 메시지는 무시 */ }
      }
      renderRooms();
    });
  } catch (e) {
    lobbyMsg('공개 방 목록 서버에 연결할 수 없습니다. 세션 코드로 입장하세요.');
  }
}

function publishRoom() {
  if (!S.mq || !S.isHost || !S.code || !S.mq.connected) return;
  S.mq.publish(TOPIC + S.code, JSON.stringify({
    code: S.code, name: S.roomName, gen: S.gen, host: S.name,
    count: clamp(Object.keys(S.players).length, 0, 12), ts: Date.now()
  }), { retain: true });
}

function unpublishRoom() {
  if (S.mq && S.isHost && S.code && S.mq.connected) {
    S.mq.publish(TOPIC + S.code, '', { retain: true });
  }
}

function renderRooms() {
  const box = $('rooms'), now = Date.now();
  const list = Object.values(S.rooms)
    .filter(r => now - r.ts < 30000)
    .sort((a, b) => (b.ts - a.ts) || a.name.localeCompare(b.name, 'ko'));
  box.textContent = '';
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '열린 방이 없습니다. 방을 만들어 보세요!';
    box.appendChild(d);
    return;
  }
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'room';
    const info = document.createElement('div');
    info.textContent = String(r.name || '이름 없는 방').slice(0, 16);
    const sub = document.createElement('span');
    sub.textContent = ' ' + r.code + ' · ' + r.count + '명';
    info.appendChild(sub);
    const b = document.createElement('button'); b.textContent = '입장';
    b.disabled = r.code === S.code && S.started;
    b.onclick = () => joinRoom(r.code, r.gen);
    row.appendChild(info); row.appendChild(b); box.appendChild(row);
  });
}

function b64UrlEncode(text) {
  const bytes = new TextEncoder().encode(String(text));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64UrlDecode(text) {
  const raw = String(text||'').replace(/-/g,'+').replace(/_/g,'/');
  const pad = raw.length % 4 ? '='.repeat(4-(raw.length%4)) : '';
  const bin = atob(raw + pad);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function quickHash(text) {
  let h1=0x811c9dc5, h2=0x9e3779b9;
  const str=String(text);
  for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619); h2=Math.imul(h2^((c<<1)|1),2246822519); }
  return ((h1>>>0).toString(36)+ (h2>>>0).toString(36)).toUpperCase().padStart(13,'0').slice(0,13);
}

}
function makeRecoveryCode(p){
  const payload={v:1,ts:Date.now(),nonce:(globalThis.crypto&&globalThis.crypto.randomUUID)?globalThis.crypto.randomUUID().replace(/-/g,''):Math.random().toString(36).slice(2),data:playerAccountData(p)};
  const packed=b64UrlEncode(JSON.stringify(payload));

function parseRecoveryCode(code){
  const raw=String(code||'').trim();
  if(!raw.startsWith('ERPG1-')) throw new Error('지원하지 않는 복구 코드');
  const parts=raw.split('-'); if(parts.length<3) throw new Error('복구 코드 형식이 올바르지 않아');
  const checksum=parts.pop().toUpperCase(), packed=parts.slice(1).join('-');
  if(quickHash(packed)!==checksum) throw new Error('복구 코드 검증에 실패했어');
  const payload=JSON.parse(b64UrlDecode(packed));
  if(!payload||payload.v!==1||!payload.data) throw new Error('복구 데이터가 없어');
  const data=payload.data;
  if(!data.name||!EMOJIS.includes(data.emoji)||!/^[A-Z0-9]{6,8}$/.test(String(data.friendCode||''))) throw new Error('복구 데이터가 손상됐어');
  const p=starterPlayer('recovered',String(data.name).slice(0,10),data.emoji,0,String(data.friendCode));
  Object.assign(p,{lv:clamp(+data.lv||1,1,99),xp:Math.max(0,Math.floor(+data.xp||0)),hp:Math.max(0,Math.floor(+data.hp||1)),gold:Math.max(0,Math.floor(+data.gold||0)),atk:Math.max(0,Math.floor(+data.atk||10)),def:Math.max(0,Math.floor(+data.def||0)),inv:data.inv&&typeof data.inv==='object'?{...data.inv}:{},equip:data.equip&&typeof data.equip==='object'?{...data.equip}:{weapon:null,armor:null},quest:data.quest&&typeof data.quest==='object'?{...data.quest}:{id:'slime_hunt',progress:0,claimed:false}});
  normalizePlayer(p);
  return p;
}

function itemCount(p, id) { return Math.max(0, Math.floor(Number((p && p.inv && p.inv[id]) || 0))); }
function addItem(p, id, n) {
  const def=ITEMS[id]; if(!def || !Number.isFinite(n) || n<=0) return 0;
  const cur=itemCount(p,id), add=Math.max(0,Math.min(Math.floor(n),(def.max||99)-cur));
  if(add) p.inv[id]=cur+add; return add;
}
function removeItem(p,id,n){
  const cur=itemCount(p,id), take=Math.max(0,Math.min(cur,Math.floor(n)));
  if(!take) return 0; p.inv[id]=cur-take; if(p.inv[id]<=0) delete p.inv[id]; return take;
}
function equipStats(p){ const w=p.equip&&ITEMS[p.equip.weapon],a=p.equip&&ITEMS[p.equip.armor]; return {atk:(w&&w.atk)||0,def:(a&&a.def)||0}; }
function effectiveAtk(p){ return 10+p.lv*3+equipStats(p).atk; }
function effectiveDef(p){ return equipStats(p).def; }
function normalizePlayer(p){
  p.friendCode=String(p.friendCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  p.inv=p.inv&&typeof p.inv==='object'?p.inv:{}; p.equip=p.equip&&typeof p.equip==='object'?p.equip:{weapon:null,armor:null};
  p.quest=p.quest&&typeof p.quest==='object'?p.quest:{id:'slime_hunt',progress:0,claimed:false};
  p.gold=Math.max(0,Math.floor(Number(p.gold)||0)); p.lv=clamp(Math.floor(Number(p.lv)||1),1,99);
  p.xp=Math.max(0,Math.floor(Number(p.xp)||0)); p.hp=clamp(Math.floor(Number(p.hp)||maxHp(p)),0,maxHp(p));
  if(!ITEMS[p.equip.weapon]) p.equip.weapon=null; if(!ITEMS[p.equip.armor]) p.equip.armor=null;
  Object.keys(p.inv).forEach(k=>{ if(!ITEMS[k]||itemCount(p,k)<=0) delete p.inv[k]; else p.inv[k]=Math.min(itemCount(p,k),ITEMS[k].max||99); });
  return p;
}

/* 빠른 입장: 공개 방이 있으면 그 방으로, 없으면 즉시 공개 방을 생성한다. */
function quickJoin() {
  readProfile();
  const publicRoom = S.rooms.PUBLC;
  const fresh = publicRoom && (Date.now() - Number(publicRoom.ts || 0) < 30000);
  S.quick = true; S.quickTried = false;
  S.code = 'PUBLC';
  S.roomName = '🌍 공개 광장';
  S.retry = 1;

  if (!fresh) {
    lobbyMsg('공개 방이 없어서 새 공개 방을 만들고 있어…');
    createRoom('PUBLC');
    return;
  }

  S.gen = Number(publicRoom.gen) || 0;
  lobbyMsg('공개 광장 접속 중…');
  ensurePeer(() => connectToHost(hostId(S.code, S.gen)));
}

function createRoom(forcedCode) {
  readProfile();
  S.quick = !!forcedCode;
  S.code = forcedCode || Math.random().toString(36).slice(2, 7).toUpperCase();
  S.roomName = forcedCode ? '🌍 공개 광장' : ($('roomName').value.trim() || S.name + '의 방').slice(0, 16);
  S.players = {}; S.mons = []; S.trades = {}; S.tradeSeq = 1; S.chat = []; S.chatGuard = {}; S.parties = {}; S.partyInvites = {}; S.reports = []; S.reportGuard = {};
  S.moveSeq = 0; S.moveAck = {}; S.pendingMoves = [];
  S.players[S.uid] = newPlayer(S.uid, S.name, S.emoji, S.score, S.friendCode);
  becomeHost(0, true);
}

function joinRoom(code, gen) {
  readProfile();
  code = String(code || '').trim().toUpperCase();
  if (code.length !== 5) { lobbyMsg('세션 코드는 5자리입니다.'); return; }
  const known = S.rooms[code];
  S.quick = false;
  S.code = code;
  S.gen = known ? known.gen : (gen || 0);
  S.roomName = known ? known.name : '';
  S.moveSeq = 0; S.moveAck = {}; S.pendingMoves = [];
  S.retry = 4; lobbyMsg('접속 중…');
  ensurePeer(() => connectToHost(hostId(S.code, S.gen)));
}

/* ============================================================
   클라이언트 측 네트워크
   ============================================================ */
function setNetState(state) {
  S.netState = state;
  updateBadge();
}

function ensurePeer(cb) {
  if (S.peer && !S.peer.destroyed && S.peer.open) {
    cb();
    return;
  }
  if (S.peer && !S.peer.destroyed && !S.peer.open) {
    if (!S.peerWaiters.includes(cb)) S.peerWaiters.push(cb);
    return;
  }

  S.peerWaiters = [cb];
  S.peer = new Peer();
  S.peer.on('open', () => {
    setNetState('ready');
    const waiters = S.peerWaiters.splice(0);
    waiters.forEach(fn => { try { fn(); } catch (e) { log('연결 준비 오류: ' + e.message); } });
    if (S.players[S.uid]) S.players[S.uid].peerId = S.peer.id;
    ensureDirectLinks();
  });
  S.peer.on('connection', acceptDirectConnection);
  S.peer.on('error', e => {
    if (e.type === 'peer-unavailable') retryConnect();
    else {
      setNetState('error');
      if (S.started) log('네트워크 오류: ' + e.type);
      else lobbyMsg('네트워크 오류: ' + e.type);
    }
  });
  S.peer.on('disconnected', () => setNetState('degraded'));
  S.peer.on('close', () => setNetState('offline'));
}

function retryConnect() {
  if (S.retry > 0) {
    S.retry--;
    setNetState('degraded');
    setTimeout(() => {
      if (S.started || S.code) ensurePeer(() => connectToHost(S.targetHid));
    }, 1200);
  } else {
    failJoin();
  }
}

function cleanupGameTimers() {
  if (S.renderHealthTimer) { clearTimeout(S.renderHealthTimer); S.renderHealthTimer = null; }
  S.gameTimers.forEach(t => clearInterval(t));
  S.gameTimers = [];
  if (S.hostTimer) { clearInterval(S.hostTimer); S.hostTimer = null; }
  if (S.hudTimer) { clearInterval(S.hudTimer); S.hudTimer = null; }
  if (S.moveTimer) { clearInterval(S.moveTimer); S.moveTimer = null; }
  if (S.roomPublishTimer) { clearInterval(S.roomPublishTimer); S.roomPublishTimer = null; }
  if (S.hostProbeTimer) { clearInterval(S.hostProbeTimer); S.hostProbeTimer = null; }
  if (S.hostElectionTimer) { clearInterval(S.hostElectionTimer); S.hostElectionTimer = null; }
  if (S.capReportTimer) { clearInterval(S.capReportTimer); S.capReportTimer = null; }
}

function cleanupNetwork() {
  cleanupGameTimers();
  try { if (S.hostPeer && !S.hostPeer.destroyed) S.hostPeer.destroy(); } catch (e) {}
  try { if (S.peer && !S.peer.destroyed) S.peer.destroy(); } catch (e) {}
  Object.values(S.directConns || {}).forEach(c => { try { c.close(); } catch (e) {} });
  Object.values(S.directConnecting || {}).forEach(c => { try { c.close(); } catch (e) {} });
  S.directConns = {};
  S.directConnecting = {};
  S.directFailures = {};
  S.directPeerUids = {};
  S.hostPeer = null;
  S.peer = null;
  S.hostConn = null;
  S.conns = {};
  S.peerWaiters = [];
}

function showConnectionError(title, message, retryFn) {
  const box = $('networkError');
  if (!box) return;
  $('networkErrorTitle').textContent = title || '⚠️ 연결 오류';
  $('networkErrorText').textContent = message || '연결을 설정하지 못했습니다.';
  S.netErrorRetry = typeof retryFn === 'function' ? retryFn : null;
  box.hidden = false;
}
function hideConnectionError() { if ($('networkError')) $('networkError').hidden = true; }
function failJoin() {
  const wasStarted = S.started;
  const code = S.code;
  cleanupNetwork();
  S.isHost = false;
  S.migrating = false;
  S.targetHid = '';
  S.hostUid = '';
  S.pendingMoves = [];
  S.walkPath = []; S.walkTo = null;
  if (wasStarted) {
    S.started = false;
    $('game').hidden = true;
    $('lobby').hidden = false;
  }
  updateBadge();
  showConnectionError('⚠️ 연결 오류', wasStarted ? '방장과의 P2P 연결과 재연결에 모두 실패했습니다.\n방 ' + code + ' 연결을 종료합니다.' : '방장 P2P 연결에 실패했습니다.\n방 코드 ' + code + ' 를 확인해 주세요.', () => {
    hideConnectionError();
    S.retry = 4;
    ensurePeer(() => connectToHost(hostId(S.code, S.gen)));
  });
}

function selfRecord() {
  const p = S.players[S.uid] || newPlayer(S.uid, S.name, S.emoji, S.score, S.friendCode);
  p.friendCode = S.friendCode;
  p.score = S.score;
  p.peerId = (S.peer && !S.peer.destroyed && S.peer.open) ? S.peer.id : String(p.peerId || '');
  p.caps = {
    cores: S.caps.cores,
    ram: S.caps.ram,
    cpuPerf: S.caps.cpuPerf,
    browserRtt: S.caps.browserRtt
  };
  p.recoveryCode = S.recoveryCode || '';
  p.accountData = playerAccountData(p);
  return p;
}

function connectToHost(hid) {
  if (!hid || !S.peer || S.peer.destroyed) return;
  S.targetHid = hid;
  if (S.hostConn && S.hostConn.open) {
    try { S.hostConn.close(); } catch (e) {}
  }
  if (S.peer.disconnected) { try { S.peer.reconnect(); } catch (e) {} }
  setNetState('connecting');
  const c = S.peer.connect(hid, { reliable: true });
  c.on('open', () => {
    if (S.hostConn && S.hostConn !== c) {
      try { S.hostConn.close(); } catch (e) {}
    }
    S.hostConn = c;
    setNetState('connected');
    c.send({ t: 'hello', p: selfRecord() });
  });
  c.on('data', onClientData);
  c.on('close', () => { if (S.hostConn === c) onHostLost(); });
  c.on('error', () => { /* close 이벤트에서 처리 */ });
}

function applyPendingFrom(serverX, serverY, ackSeq) {
  let x = serverX, y = serverY;
  S.pendingMoves = S.pendingMoves.filter(m => m.s > ackSeq);
  for (const m of S.pendingMoves) {
    x = clamp(x + m.dx, 0, W - 1);
    y = clamp(y + m.dy, 0, H - 1);
  }
  return { x, y };
}

function handleMoveAck(m) {
  const p = S.players[S.uid];
  if (!p) return;
  const seq = Math.max(0, +m.s || 0);
  const x = clamp(+m.x | 0, 0, W - 1);
  const y = clamp(+m.y | 0, 0, H - 1);
  const pos = applyPendingFrom(x, y, seq);
  p.x = pos.x;
  p.y = pos.y;
}

function onClientData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'snap') {
    const serverMe = m.p && m.p[S.uid];
    const ackSeq = Math.max(0, +(m.a && m.a[S.uid]) || 0);
    S.players = m.p || {};
    S.mons = Array.isArray(m.m) ? m.m : [];
    S.gen = Math.max(0, +m.g || 0);
    S.hostUid = String(m.h || '');
    S.moveAck = m.a && typeof m.a === 'object' ? m.a : {};
    if (m.hs && typeof m.hs === 'object') S.hostStats = m.hs;
    if (m.pt && typeof m.pt === 'object') S.parties = m.pt;
    ensureDirectLinks();
    if (Array.isArray(m.chat)) S.chat = m.chat.slice(-40);
    if (serverMe) {
      const pos = applyPendingFrom(
        clamp(+serverMe.x | 0, 0, W - 1),
        clamp(+serverMe.y | 0, 0, H - 1),
        ackSeq
      );
      S.players[S.uid].x = pos.x;
      S.players[S.uid].y = pos.y;
    }
    if (S.migrating) {
      S.migrating = false;
      log('✅ 새 방장 연결 완료');
    }
    if (!S.started) enterGame();
    setNetState('connected');
  } else if (m.t === 'ack') {
    handleMoveAck(m);
  } else if (m.t === 'trade_request') {
    const who=String(m.from||''), nm=String(m.name||'플레이어');
    const ok=confirm('🤝 '+nm+' 님이 거래를 요청했습니다. 수락할까요?');
    if(ok){ const msg={t:'trade_accept',from:who}; if(S.isHost) hostRecv({uid:S.uid,open:true,send:()=>{}},msg); else if(S.hostConn&&S.hostConn.open) S.hostConn.send(msg); }
  } else if (m.t === 'trade_state') { S.activeTrades=[m.trade]; renderTradeFromEvent();
  } else if (m.t === 'trade_end') { S.activeTrades=[]; closePanel(); log(m.reason||'거래 종료');
  } else if (m.t === 'chat') { if(m.m&&!isBlockedChatMessage(m.m)){ S.chat.push(m.m); if(S.chat.length>60) S.chat.shift(); } if($('overlayPanel').classList.contains('open')&&$('panelTitle').textContent.includes('채팅')) renderChat();
  } else if (m.t === 'party_invite') {
    const from=String(m.from||''),nm=String(m.name||'플레이어');
    if(!isBlockedUid(from)&&confirm('👥 '+nm+' 님이 파티에 초대했습니다. 참가할까요?')) sendLocalHost({t:'party_accept',from});
  } else if (m.t === 'party_state'||m.t === 'party_end') {
    S.parties=m.parties&&typeof m.parties==='object'?m.parties:{}; if(m.reason)log(m.reason); renderSocialIfOpen(); updateHud();
  } else if (m.t === 'report_ack') { log(m.s||'🚩 신고가 접수되었습니다.');
  } else if (m.t === 'shop_result') { log(m.s||'상점 처리 완료'); updateHud(); if($('overlayPanel').classList.contains('open')&&$('panelTitle').textContent.includes('상점')) renderShop();
  } else if (m.t === 'ping') {
    if (S.hostConn && S.hostConn.open) {
      try { S.hostConn.send({ t: 'pong', ts: m.ts }); } catch (e) {}
    }
  } else if (m.t === 'handoff_state') {
    S.players = m.p || S.players;
    S.mons = Array.isArray(m.m) ? m.m : S.mons;
    S.moveAck = m.a && typeof m.a === 'object' ? m.a : S.moveAck;
    S.monSeq = Math.max(1, +m.ms || S.monSeq);
    S.nextSpawn = +m.ns || Date.now() + 1500;
    S.trades = m.tr && typeof m.tr === 'object' ? m.tr : S.trades;
    S.tradeSeq = Math.max(1, +m.tq || S.tradeSeq);
    S.chat = Array.isArray(m.ch) ? m.ch.slice(-60) : S.chat; S.activeTrades = Object.values(S.trades).filter(t=>t.a===S.uid||t.b===S.uid);
    S.parties = m.pt && typeof m.pt === 'object' ? m.pt : S.parties;
    S.reports = Array.isArray(m.rp) ? m.rp.slice(-100) : S.reports;
    S.hostUid = String(m.h || S.uid);
    S.gen = Math.max(S.gen, +m.g || S.gen);
    S.handoffBusy = true;
    if (String(m.h) === S.uid) becomeHost(S.gen, false);
  } else if (m.t === 'ev') {
    if (m.k === 'handoff') {
      const target = String(m.to || '');
      const gen = Math.max(S.gen, +m.g || S.gen);
      S.gen = gen;
      if (target !== S.uid) {
        S.migrating = true;
        S.hostUid = target;
        if (S.hostConn && S.hostConn.open) { try { S.hostConn.close(); } catch (e) {} }
        S.hostConn = null;
        ensurePeer(() => connectToHost(hostId(S.code, gen)));
      }
    }
    handleEvent(m);
  }
}

/* ============================================================
   직접 P2P 메시망 + 호스트 릴레이 폴백
   - 가능한 경우 플레이어끼리 직접 연결
   - 직접 연결이 없거나 실패하면 호스트 P2P로 릴레이
   - 두 경로가 모두 실패하면 연결 오류 창 표시
   ============================================================ */
const DIRECT_REQUEST_TYPES = new Set(['trade_request', 'party_invite']);
const DIRECT_HOST_TYPES = new Set(['trade_state', 'trade_end', 'party_state', 'party_end', 'chat', 'report_ack', 'shop_result']);

function expectedUidForPeer(peerId) {
  const id = String(peerId || '');
  const found = Object.values(S.players || {}).find(p => p && p.id !== S.uid && String(p.peerId || '') === id);
  return found ? found.id : '';
}
function rememberDirect(uid, c) {
  if (!uid || !c) return false;
  const p = S.players[uid];
  if (!p || String(p.peerId || '') !== String(c.peer || '')) return false;
  const old = S.directConns[uid];
  if (old && old !== c) { try { old.close(); } catch (e) {} }
  c._uid = uid;
  S.directConns[uid] = c;
  delete S.directConnecting[uid];
  delete S.directFailures[uid];
  return true;
}
function bindDirectConnection(c, outgoingUid) {
  if (!c) return;
  c.on('open', () => {
    try { c.send({ t:'direct_hello', code:S.code, gen:S.gen, uid:S.uid, peerId:S.peer && S.peer.id }); } catch (e) {}
  });
  c.on('data', m => onDirectData(c, m));
  c.on('close', () => {
    const uid = c._uid || outgoingUid || expectedUidForPeer(c.peer);
    if (uid && S.directConns[uid] === c) delete S.directConns[uid];
    if (uid) { delete S.directConnecting[uid]; S.directFailures[uid] = Date.now(); }
  });
  c.on('error', () => {
    const uid = c._uid || outgoingUid || expectedUidForPeer(c.peer);
    if (uid) S.directFailures[uid] = Date.now();
  });
}
function acceptDirectConnection(c) { bindDirectConnection(c, ''); }
function onDirectData(c, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'direct_hello') {
    if (String(m.code || '') !== String(S.code || '') || String(m.gen || S.gen) !== String(S.gen)) return;
    const uid = String(m.uid || '');
    const known = S.players[uid];
    if (!known || uid === S.uid || String(known.peerId || '') !== String(c.peer || '')) return;
    if (!rememberDirect(uid, c)) return;
    try { c.send({ t:'direct_hello_ack', uid:S.uid, code:S.code, gen:S.gen }); } catch (e) {}
    return;
  }
  const uid = c._uid || expectedUidForPeer(c.peer);
  if (!uid || !S.players[uid]) return;
  if (m.t === 'direct_hello_ack') return;
  if (DIRECT_REQUEST_TYPES.has(m.t)) {
    if (String(m.from || '') !== uid || String(m.to || '') !== S.uid) return;
    if (isBlockedUid(uid)) return;
    if (m.t === 'trade_request') {
      const nm = String(m.name || S.players[uid].name || '플레이어');
      if (confirm('🤝 ' + nm + ' 님이 거래를 요청했습니다. 수락할까요?')) sendLocalHost({ t:'trade_accept', from:uid });
    } else if (m.t === 'party_invite') {
      const nm = String(m.name || S.players[uid].name || '플레이어');
      if (confirm('👥 ' + nm + ' 님이 파티에 초대했습니다. 참가할까요?')) sendLocalHost({ t:'party_accept', from:uid });
    }
    return;
  }
  if (DIRECT_HOST_TYPES.has(m.t) && uid === S.hostUid) onClientData(m);
}
function ensureDirectLinks() {
  if (!S.peer || S.peer.destroyed || !S.peer.open || !S.players[S.uid]) return;
  S.players[S.uid].peerId = S.peer.id;
  Object.values(S.players).forEach(p => {
    if (!p || p.id === S.uid || !p.peerId) return;
    if (String(S.uid) > String(p.id)) return;
    if (S.directConns[p.id] && S.directConns[p.id].open) return;
    if (S.directConnecting[p.id]) return;
    if (Date.now() - (S.directFailures[p.id] || 0) < 5000) return;
    try {
      const c = S.peer.connect(String(p.peerId), { reliable:true });
      S.directConnecting[p.id] = c;
      bindDirectConnection(c, p.id);
    } catch (e) { S.directFailures[p.id] = Date.now(); }
  });
}
function relayThroughHost(targetUid, msg) {
  if (S.isHost) return !!sendTo(targetUid, msg);
  if (!S.hostConn || !S.hostConn.open) return false;
  try { S.hostConn.send({ t:'relay', to:String(targetUid), msg }); return true; } catch (e) { return false; }
}
function sendPeerOrHost(targetUid, msg) {
  const uid = String(targetUid || '');
  if (!uid || uid === S.uid) return false;
  const direct = S.directConns[uid];
  if (direct && direct.open) { try { direct.send(msg); return true; } catch (e) {} }
  ensureDirectLinks();
  if (relayThroughHost(uid, msg)) return true;
  showConnectionError('⚠️ 플레이어 연결 오류', '상대 플레이어와 직접 P2P 연결에 실패했고\n방장 릴레이 연결도 사용할 수 없습니다.');
  return false;
}

/* 방장 이탈 → 우선순위 점수 기반 결정론적 선출 (모든 클라이언트가 같은 결과 도출) */
function onHostLost() {
  if (S.migrating || S.isHost) return;
  S.migrating = true;
  S.hostConn = null;
  S.pendingMoves = [];
  playSound('sys');
  setNetState('degraded');
  log('⚠️ 방장 연결이 끊겼습니다. 방장 이송 중…');

  const cands = Object.values(S.players)
    .filter(p => p && p.id !== S.hostUid);
  if (!cands.find(p => p.id === S.uid)) cands.push(selfRecord());

  cands.sort((a, b) => {
    const ca = a.caps || {};
    const cb = b.caps || {};
    const sa = capabilityScore(ca);
    const sb = capabilityScore(cb);
    return (sb - sa) || (a.id < b.id ? -1 : 1);
  });
  const winner = cands[0];
  const gen = S.gen + 1;
  const next = {};
  cands.forEach(p => { next[p.id] = p; });
  S.players = next;
  S.hostUid = '';

  if (winner && winner.id === S.uid) {
    log('👑 우선순위 1위로 내가 새 방장이 됩니다.');
    becomeHost(gen, false);
  } else if (winner) {
    log('👑 새 방장: ' + winner.name);
    S.gen = gen; S.retry = 10;
    ensurePeer(() => connectToHost(hostId(S.code, gen)));
  } else {
    failJoin();
  }
}

/* ============================================================
   방장(호스트) 로직
   ============================================================ */
function becomeHost(gen, fresh) {
  ensurePeer(() => {
    if (S.players[S.uid]) S.players[S.uid].peerId = S.peer.id;
    ensureDirectLinks();
  });
  if (S.hostPeer && !S.hostPeer.destroyed) {
    try { S.hostPeer.destroy(); } catch (e) {}
  }
  if (S.hostTimer) { clearInterval(S.hostTimer); S.hostTimer = null; }

  S.isHost = true;
  S.gen = gen;
  S.hostUid = S.uid;
  S.graceUntil = fresh ? 0 : Date.now() + 10000;

function tradeValidateOffers(t){ const a=S.players[t.a],b=S.players[t.b]; if(!a||!b)return false; for(const [id,n] of Object.entries(t.ai)){if(!ITEMS[id]||n<0||n>itemCount(a,id))return false;} for(const [id,n] of Object.entries(t.bi)){if(!ITEMS[id]||n<0||n>itemCount(b,id))return false;} return t.ag>=0&&t.ag<=a.gold&&t.bg>=0&&t.bg<=b.gold; }
function executeTrade(t){ if(!tradeValidateOffers(t)){clearTrade(t,'거래 조건이 변경되어 취소되었습니다.');return;} const a=S.players[t.a],b=S.players[t.b]; Object.entries(t.ai).forEach(([id,n])=>{removeItem(a,id,n);addItem(b,id,n);}); Object.entries(t.bi).forEach(([id,n])=>{removeItem(b,id,n);addItem(a,id,n);}); a.gold-=t.ag;b.gold-=t.bg;a.gold+=t.bg;b.gold+=t.ag; delete S.trades[t.id]; if(t.a===S.uid||t.b===S.uid){closePanel();log('✅ 거래 완료');} if(t.a!==S.uid)sendTo(t.a,{t:'trade_end',reason:'✅ 거래 완료'}); if(t.b!==S.uid)sendTo(t.b,{t:'trade_end',reason:'✅ 거래 완료'}); broadcastEvent({k:'log',s:'🤝 '+a.name+' ↔ '+b.name+' 거래 완료!'}); }

const CHAT_BAD_WORDS = [
  '씨발','시발','ㅆㅂ','ㅅㅂ','병신','ㅂㅅ','븅신','등신','개새끼','개새키','ㄱㅅㄲ','새끼','미친놈','미친년','ㅁㅊㄴ','꺼져','닥쳐','좆','ㅈㄴ','존나','졸라','섹스','sex','fuck','shit','bitch','asshole','nigger','retard'
];
const CHAT_LINK_RE = /(https?:\/\/|www\.|[a-z0-9-]+\.(com|net|org|kr|io|gg|me|tv)(?:\/|$))/i;
const CHAT_SPAM_WINDOW = 5000;
const CHAT_SPAM_LIMIT = 4;
const CHAT_REPEAT_LIMIT = 3;

function normalizeChatForFilter(text){
  return String(text||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\u200b-\u200f\u202a-\u202e\ufeff]/g,'')
    .replace(/[\s._\-~`!@#$%^&*()=+\[\]{}<>|\\/\:;,'\"`·•…]+/g,'')
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t')
    .replace(/ㅆ+/g,'ㅆ').replace(/ㅅ+/g,'ㅅ').replace(/ㅂ+/g,'ㅂ').replace(/ㅈ+/g,'ㅈ');
}

function censorChatText(text){
  let clean=String(text||'').replace(/\s+/g,' ').trim().slice(0,80);
  if(!clean)return {ok:false,text:''};
  if(CHAT_LINK_RE.test(clean))return {ok:false,text:''};
  const normalized=normalizeChatForFilter(clean);
  for(const bad of CHAT_BAD_WORDS){
    const b=normalizeChatForFilter(bad);
    if(b && normalized.includes(b)) return {ok:false,text:''};
  }
  // 반복 문자 도배 완화: 같은 글자/기호가 과도하게 반복되면 축약
  clean=clean.replace(/(.)\1{5,}/gu,'$1$1$1');
  // 과도한 이모지/기호 도배 방지
  if((clean.match(/[!！?？]{5,}/g)||[]).length) clean=clean.replace(/[!！?？]{4,}/g,'!!!');
  return {ok:true,text:clean};
}

function allowChatMessage(uid,text){
  const now=Date.now();
  const g=S.chatGuard[uid]||(S.chatGuard[uid]={times:[],last:'',repeat:0});
  g.times=g.times.filter(t=>now-t<CHAT_SPAM_WINDOW);
  if(g.times.length>=CHAT_SPAM_LIMIT)return false;
  if(text===g.last){g.repeat++;if(g.repeat>=CHAT_REPEAT_LIMIT)return false;}else{g.last=text;g.repeat=1;}
  g.times.push(now);
  return true;
}

function hostRecv(c, m) {
  if (!m || typeof m !== 'object') return;

  if (m.t === 'relay' && c.uid) {
    const target = String(m.to || '');
    const inner = m.msg && typeof m.msg === 'object' ? { ...m.msg } : null;
    if (!target || !inner || !S.players[target] || target === c.uid) return;
    if (!DIRECT_REQUEST_TYPES.has(inner.t)) return;
    inner.from = c.uid; inner.to = target;
    sendTo(target, inner);
  } else if (m.t === 'hello' && m.p) {
    if (Object.keys(S.players).length >= 12 && !S.players[String(m.p.id)]) {

function tryMove(dx, dy) {
  const p = S.players[S.uid], now = Date.now();
  if (!p || S.migrating || now - S.lastMove < 85) return;
  dx = clamp(dx | 0, -1, 1); dy = clamp(dy | 0, -1, 1);
  if (Math.abs(dx) + Math.abs(dy) !== 1) return;
  const nx = clamp(p.x + dx, 0, W - 1), ny = clamp(p.y + dy, 0, H - 1);
  if (nx === p.x && ny === p.y) return;
  if (isBlocked(nx,ny)) return;
  const monster = S.mons.find(m => m.x===nx && m.y===ny);
  if (monster) { attack(); return; }
  if (Object.values(S.players).some(q=>q.id!==S.uid&&q.x===nx&&q.y===ny)) return;
  S.lastMove = now; playSound('move');
  if (S.isHost) { p.x=nx; p.y=ny; S.moveSeq++; S.moveAck[S.uid]=S.moveSeq; }
  else if (S.hostConn && S.hostConn.open) {
    const seq=++S.moveSeq; S.pendingMoves.push({s:seq,dx,dy}); p.x=nx; p.y=ny; S.hostConn.send({t:'mv',s:seq,dx,dy});
  }
}

function findPath(start,target){
  if(!start||!target||isBlocked(target.x,target.y)) return [];
  const key=(x,y)=>x+','+y, startK=key(start.x,start.y), targetK=key(target.x,target.y);
  const open=[{x:start.x,y:start.y,g:0,f:0}], came=new Map(), cost=new Map([[startK,0]]);
  while(open.length){
    open.sort((a,b)=>a.f-b.f); const cur=open.shift(); const ck=key(cur.x,cur.y);
    if(ck===targetK){ const path=[]; let k=ck; while(k!==startK){ const q=came.get(k); if(!q) break; path.push(q.step); k=q.from; } return path.reverse(); }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx,ny=cur.y+dy,nk=key(nx,ny);
      if(isBlocked(nx,ny)) continue;
      const occupied=Object.values(S.players).some(p=>p.id!==S.uid&&p.x===nx&&p.y===ny); if(occupied) continue;
      const ng=cur.g+1; if(ng>50) continue; if(cost.has(nk)&&ng>=cost.get(nk)) continue;
      cost.set(nk,ng); const h=Math.abs(target.x-nx)+Math.abs(target.y-ny); open.push({x:nx,y:ny,g:ng,f:ng+h}); came.set(nk,{from:ck,step:[dx,dy]});
    }
  }
  return [];
}

function setWalkTarget(x,y){
  const p=S.players[S.uid]; if(!p) return;
  x=clamp(x,0,W-1); y=clamp(y,0,H-1); S.walkTo={x,y}; S.walkPath=findPath({x:p.x,y:p.y},{x,y});
  if(!S.walkPath.length && (p.x!==x||p.y!==y)) S.walkTo=null;
}

  const now = Date.now();
  if (now - S.lastAtk < 350 || S.migrating) return;
  S.lastAtk = now;
  if (S.isHost) doAttack(S.uid);
  else if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: 'atk' });
}

function bindInput() {
  if (S.inputBound) return;
  S.inputBound = true;
  const keys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
  window.addEventListener('keydown', e => {

    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { e.preventDefault(); S.walkTo = null; tryMove(k[0], k[1]); }
    else if (e.key === ' ') { e.preventDefault(); attack(); }
  });
  document.querySelectorAll('#pad button[data-dx]').forEach(b => {
    b.addEventListener('click', () => { S.walkTo = null; tryMove(+b.dataset.dx, +b.dataset.dy); });
  });
  $('btnAtk').addEventListener('click', attack);
  $('cv').addEventListener('pointerdown', e => {

    const monHere=S.mons.find(m=>m.x===S.walkTo.x&&m.y===S.walkTo.y);
    if(monHere&&cheb(monHere,p)<=1){attack();return;}
    if(!S.walkPath.length) S.walkPath=findPath({x:p.x,y:p.y},S.walkTo);
    const step=S.walkPath.shift(); if(!step){S.walkTo=null;return;}

}

const cv = $('cv'), ctx = cv.getContext('2d');

function smooth(key, x, y) {

  ctx.fillStyle = color; ctx.fillRect(px, py, w * clamp(ratio, 0, 1), 5);

function resizeCanvas() {
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const w = Math.max(1, Math.floor(window.innerWidth));
  const h = Math.max(1, Math.floor(window.innerHeight));
  if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

  const tw=clamp(Math.min(w/22,h/14),24,48), th=tw;
  const cols=Math.ceil(w/tw)+2, rows=Math.ceil(h/th)+2;
  return {w,h,tw,th,unit:tw,cols,rows};

  $('btnCreate').onclick=createRoom;
  $('btnQuick').onclick=quickJoin;
  $('btnInv').onclick=renderInventory;$('btnTrade').onclick=openTradePanel;$('btnChat').onclick=renderChat;$('btnQuest').onclick=renderQuest;$('btnSocial').onclick=renderSocial;$('btnShop').onclick=()=>{if(!nearNpc(S.players[S.uid],NPCS.merchant)){log('🏪 상인 루루에게 2칸 이내로 이동해줘.');return;}renderShop();};$('btnRecovery').onclick=renderRecoveryPanel;$('btnClosePanel').onclick=closePanel;
  $('btnCopyRecovery').onclick=copyRecoveryCode;
  $('btnNewRecovery').onclick=()=>{saveLocalAccountSnapshot();const code=issueRecoveryCode(true);updateRecoveryUI();lobbyMsg('🔄 최신 계정 데이터로 새 복구 코드를 발급했어.');};
  $('btnRecover').onclick=recoverAccountFromInput;
  readProfile(); updateRecoveryUI();
  $('networkErrorRetry').onclick=()=>{hideConnectionError();if(S.netErrorRetry){const fn=S.netErrorRetry;S.netErrorRetry=null;fn();}};
  $('networkErrorLobby').onclick=()=>{hideConnectionError();cleanupNetwork();S.started=false;$('game').hidden=true;$('lobby').hidden=false;lobbyMsg('연결 오류로 방을 종료했어.');updateBadge();};
  window.addEventListener('keydown',e=>{if(!S.started||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const k=e.key.toLowerCase();if(k==='i')renderInventory();else if(k==='t')openTradePanel();else if(k==='q')renderQuest();else if(k==='f')renderSocial();else if(k==='b'){if(nearNpc(S.players[S.uid],NPCS.merchant))renderShop();else log('🏪 상인 루루에게 2칸 이내로 이동해줘.');}});
  initDirectory();
  if (!S.roomTimer) S.roomTimer = setInterval(renderRooms, 3000);
  window.addEventListener('resize', () => {
    if (S.started) resizeCanvas();
  }, { passive: true });
  window.addEventListener('pagehide', () => {
    unpublishRoom();
    cleanupNetwork();
  });
}

initLobby();
</script>
</body>
</html>
